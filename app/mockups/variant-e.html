<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mockup E</title>
    <link rel="stylesheet" href="./mockups.css" />
  </head>
  <body>
    <div class="phone">
      <header class="header">
        <h1>Lernportal</h1>
        <p>Variante E: Thema-Drop-down als Info-Liste</p>
      </header>
      <main class="content">
        <section class="block filter-grid">
          <div>
            <label class="field-label">Fach</label>
            <select class="search">
              <option>Alle Fächer</option>
              <option>Mathematik</option>
              <option>Deutsch</option>
              <option>Geschichte</option>
            </select>
          </div>
          <div>
            <label class="field-label">Thema (mit Infos statt extra Themen-Block)</label>
            <div class="picker">
              <div class="picker-head">Thema auswählen <span>▾</span></div>
              <div class="picker-list">
                <article class="picker-item active">
                  <h4>Ableitungen und Änderungsraten</h4>
                  <p class="picker-meta">Mathematik · 2 Quizfragen · Status: Offen</p>
                </article>
                <article class="picker-item">
                  <h4>Lineare Erörterung</h4>
                  <p class="picker-meta">Deutsch · 2 Quizfragen · Status: Gelernt</p>
                </article>
                <article class="picker-item">
                  <h4>Weimarer Republik</h4>
                  <p class="picker-meta">Geschichte · 2 Quizfragen · Status: Offen</p>
                </article>
              </div>
            </div>
          </div>
          <input class="search" placeholder="Freitextsuche (z. B. Ableitung)" />
        </section>
      </main>
    </div>
  </body>
</html>
