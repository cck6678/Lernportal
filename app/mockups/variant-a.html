<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mockup A</title>
    <link rel="stylesheet" href="./mockups.css" />
  </head>
  <body>
    <div class="phone">
      <header class="header">
        <h1>Lernportal</h1>
        <p>Variante A: Top Tabs (Lernen / Quiz)</p>
      </header>
      <main class="content">
        <section class="block">
          <input class="search" placeholder="Thema suchen" />
        </section>
        <section class="tabs">
          <button class="tab">Lernen</button>
          <button class="tab active">Quiz</button>
        </section>
        <section class="block">
          <h2>Quiz direkt erreichbar</h2>
          <div class="quiz-card">
            <p><strong>Frage:</strong> Was bedeutet f'(x) &gt; 0?</p>
            <div class="answers">
              <button>Die Funktion steigt.</button>
              <button>Die Funktion fällt.</button>
              <button>Die Funktion ist konstant.</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
