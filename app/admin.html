<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inhalte bearbeiten – Lernportal</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .admin-header {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.8rem 1rem;
        background: var(--primary);
        color: var(--primary-contrast);
      }
      .admin-header a {
        color: var(--primary-contrast);
        text-decoration: none;
        font-size: 1.1rem;
      }
      .admin-header h1 {
        margin: 0;
        font-size: 1.1rem;
      }
      .admin-body {
        padding: 1rem;
        max-width: 700px;
        margin: 0 auto;
      }
      .topic-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.8rem;
        margin-bottom: 0.8rem;
        background: var(--card);
      }
      .topic-card-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .topic-card-title {
        font-weight: 700;
        font-size: 0.95rem;
      }
      .topic-card-subject {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .topic-actions {
        display: flex;
        gap: 0.4rem;
      }
      .btn-sm {
        padding: 0.3rem 0.7rem;
        font-size: 0.82rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        cursor: pointer;
      }
      .btn-sm.danger {
        color: #dc2626;
        border-color: #fca5a5;
      }
      .form-panel {
        border: 1px solid var(--primary);
        border-radius: 14px;
        padding: 1rem;
        background: var(--card);
        margin-bottom: 1rem;
      }
      .form-panel h2 {
        margin: 0 0 0.8rem;
        font-size: 1rem;
        color: var(--primary);
      }
      .form-row {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        margin-bottom: 0.7rem;
      }
      .form-row label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
      }
      .form-row input, .form-row textarea, .form-row select {
        padding: 0.5rem 0.7rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: inherit;
        background: var(--bg);
        color: var(--text);
        width: 100%;
      }
      .form-row textarea {
        resize: vertical;
        min-height: 80px;
      }
      .hint {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 0.1rem;
      }
      .quiz-item {
        border: 1px dashed var(--border);
        border-radius: 10px;
        padding: 0.7rem;
        margin-bottom: 0.6rem;
        background: var(--bg);
      }
      .quiz-item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--muted);
      }
      .section-divider {
        margin: 1rem 0 0.5rem;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      #custom-list-empty {
        color: var(--muted);
        font-size: 0.9rem;
        padding: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <header class="admin-header">
      <a href="./index.html" aria-label="Zurück zur App">←</a>
      <h1>Inhalte bearbeiten</h1>
    </header>

    <main class="admin-body">
      <!-- Formular für neues / bearbeitetes Thema -->
      <div class="form-panel" id="form-panel">
        <h2 id="form-title">Neues Thema anlegen</h2>

        <input type="hidden" id="edit-id" />

        <div class="form-row">
          <label for="f-subject">Fach</label>
          <input id="f-subject" type="text" placeholder="z.B. Mathematik" />
        </div>
        <div class="form-row">
          <label for="f-title">Thema-Titel</label>
          <input id="f-title" type="text" placeholder="z.B. Quadratische Gleichungen" />
        </div>
        <div class="form-row">
          <label for="f-keyterms">Kernbegriffe</label>
          <textarea id="f-keyterms" placeholder="Ein Begriff pro Zeile"></textarea>
          <span class="hint">Ein Begriff pro Zeile</span>
        </div>
        <div class="form-row">
          <label for="f-formulas">Formeln / Merksätze</label>
          <textarea id="f-formulas" placeholder="Eine Formel pro Zeile"></textarea>
          <span class="hint">Eine Formel pro Zeile</span>
        </div>
        <div class="form-row">
          <label for="f-examples">Beispiele</label>
          <textarea id="f-examples" placeholder="Ein Beispiel pro Zeile"></textarea>
          <span class="hint">Ein Beispiel pro Zeile</span>
        </div>

        <div class="section-divider">Quizfragen</div>
        <div id="quiz-builder"></div>
        <button class="button secondary" type="button" id="add-question-btn" style="margin-bottom:0.8rem">＋ Frage hinzufügen</button>

        <div style="display:flex; gap:0.6rem; flex-wrap:wrap">
          <button class="button" type="button" id="save-btn">Speichern</button>
          <button class="button secondary" type="button" id="cancel-btn">Abbrechen</button>
        </div>
      </div>

      <!-- Eigene Themen -->
      <div class="section-divider">Eigene Themen</div>
      <div id="custom-topic-list"></div>

      <!-- Basis-Themen (read-only Übersicht) -->
      <div class="section-divider">Basis-Themen (aus topics.js, nur Lesezugriff)</div>
      <div id="base-topic-list"></div>
    </main>

    <script type="module">
      import { topics as baseTopics } from "./data/topics.js";

      const STORE_KEY = "lernportal.customTopics";

      function load() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY)) ?? []; }
        catch { return []; }
      }

      function save(list) {
        localStorage.setItem(STORE_KEY, JSON.stringify(list));
      }

      function genId() {
        return "custom-" + Date.now();
      }

      // ── Quiz-Builder ──────────────────────────────────────────
      const quizBuilder = document.getElementById("quiz-builder");
      let quizItems = [];

      function renderQuizBuilder() {
        quizBuilder.innerHTML = "";
        quizItems.forEach((q, i) => {
          const el = document.createElement("div");
          el.className = "quiz-item";
          el.innerHTML = `
            <div class="quiz-item-header">
              Frage ${i + 1}
              <button class="btn-sm danger" data-qi="${i}" type="button">Entfernen</button>
            </div>
            <div class="form-row">
              <label>Frage</label>
              <input type="text" class="qi-question" data-i="${i}" value="${escHtml(q.question)}" placeholder="Fragentext" />
            </div>
            ${[0,1,2,3].map((oi) => `
              <div class="form-row" style="flex-direction:row;align-items:center;gap:0.4rem">
                <input type="radio" name="correct-${i}" value="${oi}" ${q.answer === oi ? "checked" : ""} />
                <input type="text" class="qi-option" data-i="${i}" data-oi="${oi}" value="${escHtml(q.options[oi] ?? "")}" placeholder="Option ${oi + 1}" style="flex:1" />
              </div>`).join("")}
            <span class="hint">Radio = richtige Antwort</span>
          `;
          el.querySelector(".btn-sm.danger").addEventListener("click", () => {
            quizItems.splice(i, 1);
            renderQuizBuilder();
          });
          el.querySelectorAll(".qi-question").forEach((inp) => {
            inp.addEventListener("input", () => { quizItems[i].question = inp.value; });
          });
          el.querySelectorAll(".qi-option").forEach((inp) => {
            inp.addEventListener("input", () => { quizItems[i].options[inp.dataset.oi] = inp.value; });
          });
          el.querySelectorAll(`input[name="correct-${i}"]`).forEach((radio) => {
            radio.addEventListener("change", () => { quizItems[i].answer = parseInt(radio.value, 10); });
          });
          quizBuilder.appendChild(el);
        });
      }

      document.getElementById("add-question-btn").addEventListener("click", () => {
        quizItems.push({ question: "", options: ["", "", "", ""], answer: 0 });
        renderQuizBuilder();
      });

      function escHtml(s) {
        return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      }

      // ── Form ──────────────────────────────────────────────────
      const editIdInput = document.getElementById("edit-id");
      const formTitle = document.getElementById("form-title");
      const fSubject = document.getElementById("f-subject");
      const fTitle = document.getElementById("f-title");
      const fKeyterms = document.getElementById("f-keyterms");
      const fFormulas = document.getElementById("f-formulas");
      const fExamples = document.getElementById("f-examples");

      function resetForm() {
        editIdInput.value = "";
        fSubject.value = "";
        fTitle.value = "";
        fKeyterms.value = "";
        fFormulas.value = "";
        fExamples.value = "";
        quizItems = [];
        renderQuizBuilder();
        formTitle.textContent = "Neues Thema anlegen";
      }

      function loadTopicIntoForm(topic) {
        editIdInput.value = topic.id;
        fSubject.value = topic.subject;
        fTitle.value = topic.title;
        fKeyterms.value = (topic.keyTerms ?? []).join("\n");
        fFormulas.value = (topic.formulas ?? []).join("\n");
        fExamples.value = (topic.examples ?? []).join("\n");
        quizItems = (topic.quiz ?? []).map((q) => ({
          question: q.question,
          options: [...q.options],
          answer: q.answer
        }));
        renderQuizBuilder();
        formTitle.textContent = "Thema bearbeiten";
        document.getElementById("form-panel").scrollIntoView({ behavior: "smooth" });
      }

      document.getElementById("save-btn").addEventListener("click", () => {
        const subj = fSubject.value.trim();
        const title = fTitle.value.trim();
        if (!subj || !title) {
          alert("Bitte Fach und Titel ausfüllen.");
          return;
        }
        const topic = {
          id: editIdInput.value || genId(),
          subject: subj,
          title,
          keyTerms: fKeyterms.value.split("\n").map((s) => s.trim()).filter(Boolean),
          formulas: fFormulas.value.split("\n").map((s) => s.trim()).filter(Boolean),
          examples: fExamples.value.split("\n").map((s) => s.trim()).filter(Boolean),
          quiz: quizItems.filter((q) => q.question.trim() && q.options.some((o) => o.trim()))
        };
        const list = load();
        const idx = list.findIndex((t) => t.id === topic.id);
        if (idx >= 0) {
          list[idx] = topic;
        } else {
          list.push(topic);
        }
        save(list);
        resetForm();
        renderCustomList();
        alert(`Thema „${topic.title}" gespeichert!`);
      });

      document.getElementById("cancel-btn").addEventListener("click", resetForm);

      // ── Custom topic list ─────────────────────────────────────
      function renderCustomList() {
        const list = load();
        const el = document.getElementById("custom-topic-list");
        if (list.length === 0) {
          el.innerHTML = "<p id='custom-list-empty'>Noch keine eigenen Themen angelegt.</p>";
          return;
        }
        el.innerHTML = list.map((t) => `
          <div class="topic-card">
            <div class="topic-card-row">
              <div>
                <div class="topic-card-title">${escHtml(t.title)}</div>
                <div class="topic-card-subject">${escHtml(t.subject)} · ${t.quiz.length} Fragen</div>
              </div>
              <div class="topic-actions">
                <button class="btn-sm edit-btn" data-id="${t.id}" type="button">Bearbeiten</button>
                <button class="btn-sm danger delete-btn" data-id="${t.id}" type="button">Löschen</button>
              </div>
            </div>
          </div>
        `).join("");
        el.querySelectorAll(".edit-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const topic = load().find((t) => t.id === btn.dataset.id);
            if (topic) loadTopicIntoForm(topic);
          });
        });
        el.querySelectorAll(".delete-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const topic = load().find((t) => t.id === btn.dataset.id);
            if (topic && confirm(`Thema „${topic.title}" wirklich löschen?`)) {
              save(load().filter((t) => t.id !== btn.dataset.id));
              renderCustomList();
            }
          });
        });
      }

      // ── Base topic list ───────────────────────────────────────
      function renderBaseList() {
        const el = document.getElementById("base-topic-list");
        el.innerHTML = baseTopics.map((t) => `
          <div class="topic-card" style="opacity:0.7">
            <div class="topic-card-title">${escHtml(t.title)}</div>
            <div class="topic-card-subject">${escHtml(t.subject)} · ${t.quiz.length} Fragen</div>
          </div>
        `).join("");
      }

      resetForm();
      renderCustomList();
      renderBaseList();
    </script>
  </body>
</html>
