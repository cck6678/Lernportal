<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mockup C</title>
    <link rel="stylesheet" href="./mockups.css" />
  </head>
  <body>
    <div class="phone">
      <header class="header">
        <h1>Lernportal</h1>
        <p>Variante C: Segmentleiste unter Suche</p>
      </header>
      <main class="content">
        <section class="block">
          <input class="search" placeholder="Thema suchen" />
          <div class="segments" style="margin-top: 0.6rem">
            <button class="segment">Zusammenfassung</button>
            <button class="segment active">Quiz</button>
            <button class="segment">Fortschritt</button>
          </div>
        </section>
        <section class="block">
          <h2>Thema: Weimarer Republik</h2>
          <div class="quiz-card">
            <p><strong>Frage:</strong> Welches Jahr gilt als Krisenjahr?</p>
            <div class="answers">
              <button>1918</button>
              <button>1923</button>
              <button>1929</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
