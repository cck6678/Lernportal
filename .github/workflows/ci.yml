name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Verify toolchain versions
        run: |
          node -v
          corepack prepare pnpm@9.12.3 --activate
          pnpm -v

      - name: Validate content and quiz data
        run: pnpm run content:validate
